<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="听闻两位有喜，我们有话想说">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
<title>如画与浩然订婚之喜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: one red invitation card — greeting first, then the video set into it like a framed photo */
:root {
  --red: #8f1d1f;
  --red-deep: #5e0f13;
  --gold: #e3bb6a;
  --gold-soft: #f3dcaa;
  --ink: #fff4e2;
  --muted: #e7c9a8;
  --display: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif;
  --body: "Noto Serif SC", "Songti SC", "SimSun", serif;
  color-scheme: dark;
}
html { background: var(--red-deep); }
body {
  background:
    radial-gradient(ellipse at 50% 0%, #a8292a 0%, transparent 60%),
    var(--red-deep);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.7;
  min-height: 100%;
  padding-inline: 16px;
  padding-block: 40px 56px;
  box-sizing: border-box;
}
.card {
  max-width: 760px;
  margin: 0 auto;
  background: var(--red);
  border: 1px solid var(--gold);
  outline: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
  outline-offset: 6px;
  border-radius: 4px;
  padding-inline: clamp(18px, 5vw, 56px);
  padding-block: clamp(36px, 7vw, 64px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  text-align: center;
  position: relative;
}
.xi {
  font-family: var(--display);
  font-size: 56px;
  line-height: 1;
  color: var(--gold);
  width: 92px; height: 92px;
  display: grid; place-items: center;
  border: 1px solid var(--gold);
  border-radius: 50%;
}
.xi svg { width: 44px; height: 44px; fill: var(--gold); margin-top: 4px; animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .xi svg { animation: none; } }
.names { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.couple {
  margin: 0;
  font-size: clamp(20px, 5.4vw, 26px);
  font-weight: 600;
  letter-spacing: 0.18em;
  padding-left: 0.18em;
  color: var(--gold-soft);
  display: flex; align-items: center; flex-wrap: wrap; justify-content: center;
}
.couple .amp {
  font-family: var(--display);
  font-weight: 400;
  color: var(--gold);
  margin-inline: 0.5em 0.6em;
  letter-spacing: 0;
}
.eyebrow {
  font-size: 14px;
  letter-spacing: 0.4em;
  color: var(--muted);
  margin: 0;
  padding-left: 0.4em;
}
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(44px, 11vw, 88px);
  line-height: 1.15;
  color: var(--gold-soft);
  margin: 0;
  text-wrap: balance;
  letter-spacing: 0.06em;
}
h1 span { display: inline-block; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
.blessing {
  margin: 0;
  max-width: 30em;
  color: var(--ink);
  font-size: clamp(18px, 4.6vw, 22px);
  letter-spacing: 0.12em;
}
.rule {
  width: 120px; height: 1px; background: var(--gold); border: 0; margin: 0;
  position: relative; overflow: visible;
}
.rule::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 8px; height: 8px; background: var(--gold);
  transform: translate(-50%, -50%) rotate(45deg);
}
button.play {
  font-family: var(--body);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.15em;
  color: var(--red-deep);
  background: var(--gold);
  border: 0;
  border-radius: 999px;
  padding: 12px 30px 12px 26px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px;
  transition: transform .2s, background .2s;
}
button.play:hover { background: var(--gold-soft); transform: translateY(-1px); }
button.play:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
button.play svg { width: 14px; height: 14px; fill: currentColor; }
.video-wrap {
  width: 100%;
  display: flex; flex-direction: column; gap: 12px;
  scroll-margin-top: 24px;
}
.frame {
  width: 100%;
  max-width: 100%;
  border: 1px solid var(--gold);
  padding: 6px;
  background: var(--red-deep);
  box-sizing: border-box;
}
video { display: block; width: 100%; height: auto; aspect-ratio: 960 / 544; background: #000; }
.caption { font-size: 14px; color: var(--muted); margin: 0; letter-spacing: 0.1em; }
.sign { margin: 0; font-size: 15px; color: var(--muted); }
.sign b { font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--gold-soft); letter-spacing: 0.1em; }
/* Size and rotation are set by script from the phone's real visible area */
.stage {
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  z-index: 100;
  background: #000;
  overflow: hidden;
  transform-origin: 0 0;
}
.stage video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  aspect-ratio: auto;
  background: #000;
}
.stage-tools {
  position: absolute;
  top: max(12px, env(safe-area-inset-top, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex;
  gap: 10px;
  z-index: 2;
}
.close, .turn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  background: rgba(0,0,0,.55);
  color: var(--gold-soft);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  display: grid; place-items: center;
  padding: 0;
}
.turn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.turn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }
html.watching, body.watching { overflow: hidden; height: 100%; overscroll-behavior: none; }
.close:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }
@keyframes rise { from { opacity: 0.001; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { h1 span { animation: none; } button.play { transition: none; } }
</style>
</head>
<body>
<main class="card">
  <div class="xi" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.2 0 3.6 1.2 4.4 2.5.8-1.3 2.2-2.5 4.4-2.5 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
  <div class="names">
    <p class="couple">谢如画<span class="amp" aria-label="与">&amp;</span>王浩然</p>
    <p class="eyebrow">订婚之喜</p>
  </div>
  <h1><span style="animation-delay:.05s">祝你们</span><span style="animation-delay:.3s">订婚快乐</span></h1>
  <hr class="rule">
  <p class="blessing">听闻两位有喜，我们有话想说</p>
  <button class="play" id="playBtn" type="button">
    <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1l11 6-11 6z"/></svg>
    点开看看
  </button>


  <p class="sign">恭喜恭喜<br><b>百年好合</b></p>
</main>

<div class="stage" id="stage" role="dialog" aria-label="祝福视频" hidden>
  <video id="vid" src="video.mp4" poster="poster.jpg" controls playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5-page" x5-video-orientation="landscape|portrait" preload="metadata"></video>
  <div class="stage-tools">
    <button class="turn" id="turnBtn" type="button" aria-label="切换横屏或竖屏">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2"/><path d="M18.5 2v4h-4M5.5 22v-4h4"/></svg>
    </button>
    <button class="close" id="closeBtn" type="button" aria-label="关闭视频">×</button>
  </div>
</div>

<script>
  const btn = document.getElementById('playBtn');
  const vid = document.getElementById('vid');
  const stage = document.getElementById('stage');
  const closeBtn = document.getElementById('closeBtn');

  const turnBtn = document.getElementById('turnBtn');
  let wantLandscape = true;   // viewer can flip this with the rotate button

  // Fit the stage to exactly what the phone shows right now. When the phone is
  // upright and landscape is wanted, lay the stage sideways across the screen.
  function layout() {
    if (stage.hidden) return;
    const vv = window.visualViewport;
    const W = Math.round(vv ? vv.width : window.innerWidth);
    const H = Math.round(vv ? vv.height : window.innerHeight);
    const ox = vv ? vv.offsetLeft : 0;
    const oy = vv ? vv.offsetTop : 0;
    if (wantLandscape && H > W) {
      stage.style.width = H + 'px';
      stage.style.height = W + 'px';
      stage.style.transform = `translate(${ox + W}px, ${oy}px) rotate(90deg)`;
    } else {
      stage.style.width = W + 'px';
      stage.style.height = H + 'px';
      stage.style.transform = `translate(${ox}px, ${oy}px)`;
    }
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => { layout(); setTimeout(layout, 300); });
  window.visualViewport?.addEventListener('resize', layout);
  window.visualViewport?.addEventListener('scroll', layout);
  document.addEventListener('fullscreenchange', () => setTimeout(layout, 50));
  document.addEventListener('webkitfullscreenchange', () => setTimeout(layout, 50));

  turnBtn.addEventListener('click', () => {
    wantLandscape = !wantLandscape;
    if (!wantLandscape) { try { screen.orientation?.unlock?.(); } catch (e) {} }
    layout();
  });

  btn.addEventListener('click', () => {
    stage.hidden = false;
    document.documentElement.classList.add('watching');
    document.body.classList.add('watching');
    layout();
    stage.animate?.([{ opacity: 0 }, { opacity: 1 }], { duration: 500, easing: 'ease-out' });
    vid.muted = false;
    const p = vid.play();
    if (p && p.catch) p.catch(() => {});
    // Try real fullscreen + landscape lock where the browser allows it; the CSS rotation covers the rest
    try {
      // Fullscreen the whole page, not the stage: browsers force `transform: none`
      // on the fullscreen element itself, which would undo the sideways layout.
      const root = document.documentElement;
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      const fs = req ? req.call(root, { navigationUI: 'hide' }) : null;
      if (fs && fs.then) {
        fs.then(() => screen.orientation?.lock?.('landscape'))
          .then(layout, layout)
          .catch(() => {});
      }
    } catch (e) {}
    setTimeout(layout, 300);
  });

  function closeStage() {
    vid.pause();
    stage.hidden = true;
    document.documentElement.classList.remove('watching');
    document.body.classList.remove('watching');
    try { screen.orientation?.unlock?.(); } catch (e) {}
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }
  closeBtn.addEventListener('click', closeStage);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !stage.hidden) closeStage(); });
</script>
</body>
</html>
